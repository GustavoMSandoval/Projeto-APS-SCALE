<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Sistema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body, html {
            height: 100%;
            margin: 0;
            background-color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        .register-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 0;
        }
        .register-content {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }
        .form-control {
            border: none;
            border-bottom: 2px solid #e0e0e0;
            border-radius: 0;
            padding: 10px 5px;
            background-color: transparent;
            transition: border-color 0.3s;
        }
        .form-control:focus {
            box-shadow: none;
            border-bottom-color: #198754;
            background-color: transparent;
        }
        .btn-register {
            background-color: #198754;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 12px;
            font-weight: 600;
            margin-top: 30px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .btn-register:hover {
            background-color: #146c43;
            color: white;
        }
        label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            color: #6c757d;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

<div class="register-container">
    <div class="register-content">
        <div class="mb-5 text-start">
            <h1 class="fw-bold text-dark mb-2">Criar Conta</h1>
            <p class="text-secondary">Preencha os dados abaixo para se cadastrar</p>
        </div>

        <form method="post">
            {% csrf_token %}
            
            {% for field in form %}
            <div class="mb-4">
                <label>{{ field.label }}</label>
                {{ field }}
                {% for error in field.errors %}
                <div class="text-danger style" style="font-size: 0.7rem; margin-top: 5px;">{{ error }}</div>
                {% endfor %}
            </div>
            {% endfor %}

            <button type="submit" class="btn btn-register w-100">Finalizar Cadastro</button>
        </form>

        <div class="mt-5 text-center">
            <span class="text-muted small">Já possui uma conta?</span>
            <a href="{% url 'login' %}" class="text-success fw-bold text-decoration-none small ms-1">ENTRAR AQUI</a>
        </div>
    </div>
</div>

<script>
    document.querySelectorAll('input').forEach(input => {
        if (input.type !== 'submit' && input.type !== 'hidden') {
            input.classList.add('form-control');
        }
    });
</script>

</body>
</html>
