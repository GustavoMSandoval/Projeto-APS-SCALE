<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Sistema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body, html {
            height: 100%;
            margin: 0;
            background-color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        .login-container {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-content {
            width: 100%;
            max-width: 350px;
            padding: 20px;
        }
        .form-control {
            border: none;
            border-bottom: 2px solid #e0e0e0;
            border-radius: 0;
            padding: 12px 5px;
            background-color: transparent;
            transition: border-color 0.3s;
        }
        .form-control:focus {
            box-shadow: none;
            border-bottom-color: #198754;
            background-color: transparent;
        }
        .btn-login {
            background-color: #198754;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 12px;
            font-weight: 600;
            margin-top: 20px;
            letter-spacing: 0.5px;
        }
        .btn-login:hover {
            background-color: #146c43;
            color: white;
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="login-content">
        <div class="mb-5">
            <h1 class="fw-bold text-dark mb-2">Login</h1>
            <p class="text-secondary">Insira seus dados para acessar</p>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="mb-4">
                <label class="small fw-bold text-uppercase text-secondary">Usuário</label>
                <input type="text" name="username" class="form-control" required autocomplete="off">
            </div>

            <div class="mb-4">
                <label class="small fw-bold text-uppercase text-secondary">Senha</label>
                <input type="password" name="password" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-login w-100">ENTRAR</button>
        </form>

        <div class="mt-5 text-center">
            <span class="text-muted small">Não possui uma conta?</span>
            <a href="{% url 'register' %}" class="text-success fw-bold text-decoration-none small ms-1">REGISTRAR-SE</a>
        </div>
    </div>
</div>

</body>
</html>
