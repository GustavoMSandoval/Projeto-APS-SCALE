{% extends 'panel_admin/base.html' %}

{% block content %}

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">Editar Projeto</h2>

        <a href="{% url 'project' %}" class="btn btn-secondary">
            Voltar
        </a>
    </div>

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label>Nome</label>
            <input type="text" name="name" class="form-control"
                   value="{{ project.name }}">
        </div>

        <div class="mb-3">
            <label>Descrição</label>
            <textarea name="description" class="form-control">{{ project.description }}</textarea>
        </div>

        <div class="mb-3">
            <label>Usuário</label>
            <select name="user" class="form-control">
                {% for u in users %}
                    <option value="{{ u.id }}"
                        {% if u.id == project.user.id %}selected{% endif %}>
                        {{ u.username }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <button class="btn btn-success">
            Salvar
        </button>
    </form>

</div>

{% endblock %}
