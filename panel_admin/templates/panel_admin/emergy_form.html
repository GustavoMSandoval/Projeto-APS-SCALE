{% extends 'panel_admin/base.html' %}

{% block content %}

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">
            {% if item %}Editar{% else %}Criar{% endif %} Referência
        </h2>

        <a href="{% url 'emergy_list' %}" class="btn btn-secondary">
            Voltar
        </a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body">

            <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Recurso</label>
                    <input type="text" 
                           name="resource_name" 
                           class="form-control"
                           value="{{ item.resource_name|default:'' }}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Unidade</label>
                    <input type="text" 
                           name="unit" 
                           class="form-control"
                           value="{{ item.unit|default:'' }}">
                </div>

                <div class="mb-3">
                    <label class="form-label">UEV</label>
                    <input type="text" 
                           name="uev_value" 
                           class="form-control"
                           value="{{ item.uev_value|default:'' }}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Fonte</label>
                    <input type="text" 
                           name="source" 
                           class="form-control"
                           value="{{ item.source|default:'' }}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Categoria</label>
                    <input type="text" 
                           name="category" 
                           class="form-control"
                           value="{{ item.category|default:'' }}">
                </div>

                <div class="d-flex justify-content-end mt-4">
                    <button type="submit" class="btn btn-success">
                        Salvar
                    </button>
                </div>

            </form>

        </div>
    </div>

</div>

{% endblock %}
